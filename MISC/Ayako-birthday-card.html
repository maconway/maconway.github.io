<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ayako's Birthday Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* Layout: one paper card down the middle; vertical Japanese greeting on the edge, a vermilion seal, Momo's photos taped on like keepsakes. */
:root {
  --paper: #FBF6F3;
  --card: #FFFDFB;
  --ink: #22304D;
  --muted: #6C7590;
  --sakura: #E7A2B2;
  --shu: #C2432F;
  --tape: rgba(231, 162, 178, 0.55);
  --line: #EADFDB;
  --shadow: 0 1px 2px rgba(34, 48, 77, 0.08), 0 12px 32px rgba(34, 48, 77, 0.10);
  --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141826; --card: #1C2133; --ink: #F2EAE5; --muted: #A4ABC2;
    --sakura: #EBA9B8; --shu: #E0614D; --tape: rgba(235, 169, 184, 0.40);
    --line: #2C3247; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 14px 36px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141826; --card: #1C2133; --ink: #F2EAE5; --muted: #A4ABC2;
  --sakura: #EBA9B8; --shu: #E0614D; --tape: rgba(235, 169, 184, 0.40);
  --line: #2C3247; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 14px 36px rgba(0,0,0,0.35);
  color-scheme: dark;
}

html, body { min-height: 100%; }
html,body{margin:0}
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 1rem;
  line-height: 1.6;
  padding: 0 16px;
  padding-block: clamp(24px, 6vw, 56px);
  overflow-x: hidden;
}
#petals {
  position: fixed; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}
.card {
  position: relative; z-index: 1;
  max-width: 560px; margin: 0 auto;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: var(--shadow);
  padding: clamp(28px, 7vw, 52px) clamp(20px, 6vw, 48px) clamp(28px, 6vw, 44px);
  display: grid; gap: clamp(28px, 6vw, 40px);
}

/* Header */
.head { position: relative; display: grid; gap: 14px; padding-right: 56px; }
.eyebrow {
  font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted);
}
h1 {
  font-family: var(--display); font-weight: 800;
  font-size: clamp(2.4rem, 10vw, 3.6rem);
  line-height: 1.05; margin: 0;
  text-wrap: balance;
}
h1 .name { color: var(--shu); display: block; }
.tate {
  position: absolute; top: 0; right: 0;
  writing-mode: vertical-rl;
  font-family: var(--display); font-weight: 500;
  font-size: 1.05rem; letter-spacing: 0.25em;
  color: var(--muted);
}
.seal {
  position: absolute; right: -6px; bottom: -18px;
  width: 54px; height: 54px;
  border: 2.5px solid var(--shu); border-radius: 8px;
  color: var(--shu);
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 1.9rem; line-height: 1;
  transform: rotate(-8deg);
  opacity: 0.88;
}

/* Photos */
.photo {
  position: relative; margin: 0;
  background: var(--card);
  padding: 10px 10px 0;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.photo img { display: block; width: 100%; height: auto; max-width: 100%; }
.photo figcaption {
  font-family: var(--display); font-size: 0.95rem; color: var(--muted);
  padding: 10px 4px 12px; text-align: center;
}
.photo::before {
  content: ""; position: absolute; top: -10px; left: 50%;
  width: 88px; height: 22px; background: var(--tape);
  transform: translateX(-50%) rotate(-3deg);
}
.hero { transform: rotate(-1.2deg); }

.message {
  font-family: var(--display); font-weight: 700;
  font-size: clamp(1.5rem, 6vw, 2rem);
  line-height: 1.3; margin: 0;
  text-wrap: balance;
}

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
.pair .photo { padding: 8px 8px 0; }
.pair .photo:first-child { transform: rotate(1.6deg); margin-top: 14px; }
.pair .photo:last-child { transform: rotate(-1.8deg); }
.pair .photo::before { width: 60px; height: 18px; }
.pair figcaption { font-size: 0.85rem; padding: 8px 2px 10px; }
@media (max-width: 420px) {
  .pair { grid-template-columns: 1fr; }
  .pair .photo:first-child { margin-top: 0; }
}

.sign {
  border-top: 1px solid var(--line);
  padding-top: 22px;
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px;
}
.sign .love { font-family: var(--display); font-size: 1.25rem; font-weight: 700; }
.sign .date { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { #petals { display: none; } }
</style>
</head>

<script>
(() => {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('petals');
  const ctx = c.getContext('2d');
  let w, h, dpr, petals = [];
  const color = () => getComputedStyle(document.documentElement).getPropertyValue('--sakura').trim() || '#E7A2B2';
  let fill = color();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => fill = color());
  new MutationObserver(() => fill = color()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    c.width = w * dpr; c.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(26, Math.max(12, w / 40)));
    while (petals.length < n) petals.push(make(true));
    petals.length = n;
  }
  function make(anywhere) {
    return {
      x: Math.random() * w, y: anywhere ? Math.random() * h : -20,
      r: 5 + Math.random() * 6, vy: 0.35 + Math.random() * 0.6,
      sway: Math.random() * Math.PI * 2, swaySpeed: 0.008 + Math.random() * 0.012,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.02,
      a: 0.35 + Math.random() * 0.4
    };
  }
  function petal(p) {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = p.a; ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(0, -p.r);
    ctx.bezierCurveTo(p.r * 0.9, -p.r * 0.6, p.r * 0.7, p.r * 0.7, 0, p.r);
    ctx.bezierCurveTo(-p.r * 0.7, p.r * 0.7, -p.r * 0.9, -p.r * 0.6, -p.r * 0.15, -p.r * 0.85);
    ctx.lineTo(0, -p.r * 0.6);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function tick() {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < petals.length; i++) {
      const p = petals[i];
      p.sway += p.swaySpeed;
      p.x += Math.sin(p.sway) * 0.5 + 0.15;
      p.y += p.vy; p.rot += p.vr;
      if (p.y > h + 20 || p.x > w + 20) petals[i] = make(false);
      petal(p);
    }
    requestAnimationFrame(tick);
  }
  addEventListener('resize', resize);
  resize(); tick();
})();
</script>
